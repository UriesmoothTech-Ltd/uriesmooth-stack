[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uriesmooth-stack"
version = "0.1.0"
description = "Android-first automation core for Uriesmooth Ltd"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alphauriel = "alphauriel_pascal.cli:main"

[tool.setuptools]
packages = ["alphauriel_pascal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
